name: Run Amazon Deals Bot

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main ]

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create posted_deals.json if not exists
      run: |
        if [ ! -f posted_deals.json ]; then
          echo '[]' > posted_deals.json
        fi
    
    - name: Run Amazon Deals Bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
      run: |
        python bot.py &
        BOT_PID=$!
        # Run for 55 minutes (to allow 5 minutes for next scheduled run)
        sleep 3300
        kill $BOT_PID
